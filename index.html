<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Trading Calculators</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: #fff;
        }
        .home-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            justify-content: center;
            padding: 50px 20px;
        }
        .home-card {
            flex: 1 1 300px;
            max-width: 380px;
            background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            border: 1px solid #333;
            border-radius: 28px;
            padding: 36px 24px 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            color: #fff;
            text-decoration: none;
            display: block;
        }
        .home-card:hover {
            transform: translateY(-6px);
            border-color: #3b82f6;
            box-shadow: 0 14px 28px rgba(59,130,246,0.2);
        }
        .home-card .icon { font-size: 3.5rem; margin-bottom: 16px; }
        .home-card h2 { font-size: 2.2rem; font-weight: 700; margin-bottom: 8px; }
        .home-card p { color: #aaa; font-size: 1rem; line-height: 1.4; }

        @media (max-width: 600px) {
            .home-card { padding: 24px 16px; }
            .home-card h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="home-cards">
        <a href="crypto.html" class="home-card">
            <div class="icon">📊</div>
            <h2>Crypto Futures</h2>
            <p>P&L ledger, leverage, auto 60%, interactive chart & simulation</p>
        </a>
        <a href="forex.html" class="home-card">
            <div class="icon">💱</div>
            <h2>Forex</h2>
            <p>Pairs, pip value, risk‑based lots, leverage, charts & simulation</p>
        </a>
    </div>
</body>
</html>
